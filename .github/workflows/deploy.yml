name: Build and upload to Blueboard

# Runs on every change to the repository (for example when you save a story
# in the phone editor). It builds the site and uploads only what changed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show what would be uploaded, upload nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python build.py
        env:
          GA_ID: ${{ vars.GA_ID }}
          BUTTONDOWN: ${{ vars.BUTTONDOWN }}

      # Credentials come from the repository secrets FTP_SERVER, FTP_USERNAME,
      # FTP_PASSWORD (Settings > Secrets and variables > Actions).
      # Optional variable FTP_DIR: target folder on the hosting, default "./".
      - name: Upload to Blueboard (FTP over TLS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || './' }}
          dry-run: ${{ inputs.dry_run == true }}
