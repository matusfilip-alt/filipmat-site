name: Build and publish to Blueboard

# Runs on every change to the repository (for example when you save a story
# in the phone editor). It builds the site and pushes the finished files to
# Blueboard's Git deployment, which publishes them to filipmat.us.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BLUEBOARD_REMOTE: git@neuron.blueboard.cz:filipmat.us
  BLUEBOARD_HOST: neuron.blueboard.cz
  # Never wait for a prompt: fail fast with a clear message instead.
  GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o StrictHostKeyChecking=accept-new
  GIT_TERMINAL_PROMPT: "0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build the site
        run: python build.py
        env:
          GA_ID: ${{ vars.GA_ID }}
          BUTTONDOWN: ${{ vars.BUTTONDOWN }}

      # The private deploy key lives in the repository secret BLUEBOARD_SSH_KEY.
      # Its public half is registered at Blueboard > filipmat.us > Git.
      - name: Set up SSH
        env:
          KEY: ${{ secrets.BLUEBOARD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "deploy key: valid" || { echo "deploy key: NOT valid, paste it again"; exit 1; }
          ssh-keyscan -T 20 "$BLUEBOARD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "checking access to Blueboard Git..."
          timeout 60 git ls-remote "$BLUEBOARD_REMOTE" && echo "access: OK"

      # Start from what is already published, so only changed files are sent.
      - name: Publish to Blueboard
        timeout-minutes: 20
        run: |
          git config --global user.name "filipmat-site deploy"
          git config --global user.email "deploy@filipmat.us"
          if git ls-remote --exit-code --heads "$BLUEBOARD_REMOTE" production >/dev/null 2>&1; then
            echo "fetching what is already published..."
            git clone --depth 1 --branch production "$BLUEBOARD_REMOTE" publish
            find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            echo "first publish"
            git init -q -b production publish
            git -C publish remote add origin "$BLUEBOARD_REMOTE"
          fi
          cp -a dist/. publish/
          cd publish
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to publish."
            exit 0
          fi
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          echo "pushing $(git count-objects -vH | grep size-pack)..."
          git push --progress origin HEAD:production
